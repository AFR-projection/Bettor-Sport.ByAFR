# Alembic configuration for AI Bettor.
#
# There is no `sqlalchemy.url` here on purpose: alembic/env.py reads
# DATABASE_URL through the app's own config, so `alembic upgrade head` and the
# running app can never point at different databases. Override for a one-off
# with:  alembic -x url=postgresql://… upgrade head
#
# Note the app also self-heals its schema at startup (`init_db()`:
# `create_all` + additive ALTERs), so a fresh deploy works without running
# alembic at all. Migrations are here for reviewable, ordered schema changes.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

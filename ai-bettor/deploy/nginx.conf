# AI Bettor — Nginx reverse proxy.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ai-bettor
#   sudo ln -s /etc/nginx/sites-available/ai-bettor /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a certificate (this rewrites the server blocks for you):
#   sudo certbot --nginx -d bettor.example.com
#
# Replace bettor.example.com everywhere below.

upstream ai_bettor {
    # Must match the app's bind address (docker-compose publishes
    # 127.0.0.1:8000; the systemd unit uses HOST/PORT from .env).
    server 127.0.0.1:8000;
    keepalive 16;
}

# Rate limit: the API fans out to The Odds API, so a scraped endpoint costs
# quota, not just CPU. Generous enough for a dashboard polling every 15s.
limit_req_zone $binary_remote_addr zone=ai_bettor_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bettor.example.com;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bettor.example.com;

    # certbot fills these in. Until then, run the HTTP block only.
    ssl_certificate     /etc/letsencrypt/live/bettor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettor.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The dashboard is a single self-contained page; nothing is embedded
    # anywhere, so framing and sniffing are simply refused.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chart.js comes from jsDelivr; everything else is same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    client_max_body_size 2m;

    access_log /var/log/nginx/ai-bettor.access.log;
    error_log  /var/log/nginx/ai-bettor.error.log;

    location / {
        limit_req zone=ai_bettor_api burst=30 nodelay;

        proxy_pass http://ai_bettor;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A manual /automation/trigger runs a full cycle: scan, simulate,
        # score, notify. That is minutes, not seconds.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
    }

    # Docs describe every write endpoint. They are token-guarded in the app;
    # uncomment to keep them off the public internet entirely.
    # location ~ ^/(docs|redoc|openapi\.json) {
    #     return 404;
    # }
}

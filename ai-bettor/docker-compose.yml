version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_bettor
      POSTGRES_USER: ai_bettor
      POSTGRES_PASSWORD: ai_bettor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_bettor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ai_bettor:ai_bettor@db:5432/ai_bettor
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TIMEZONE: ${TIMEZONE:-Asia/Jakarta}
      MONTE_CARLO_SIMULATIONS: ${MONTE_CARLO_SIMULATIONS:-20000}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      BETTING_MODE: ${BETTING_MODE:-PAPER}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
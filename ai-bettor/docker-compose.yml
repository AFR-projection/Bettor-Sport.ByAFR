# AI Bettor — single service. The database lives on Neon (serverless
# PostgreSQL), so there is no local `db` container and no local volume to lose.
#
# Everything comes from `.env` next to this file — DATABASE_URL, API_TOKEN,
# ALLOWED_ORIGINS and the integration keys. Nothing is defaulted here, so a
# missing value fails visibly at startup instead of running with a placeholder.
#
#   cp deploy/env.production.example .env   # then fill it in
#   docker compose up -d --build
#
# `version:` is intentionally omitted — it is obsolete in Compose v2 and only
# prints a warning.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: ai-bettor:latest
    container_name: ai-bettor
    env_file: .env
    # Bound to loopback: Nginx terminates TLS and proxies to it. Publishing
    # 0.0.0.0:8000 would expose the API directly, bypassing the reverse proxy.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # A crash loop against a bad DATABASE_URL should not hammer Neon forever.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bettor"
version = "0.1.0"
description = "AI Bettor - Autonomous AI sports betting analysis agent"

[project.dependencies]
fastapi = ">=0.100.0"
uvicorn = ">=0.27.0"
psycopg2-binary = ">=2.9.0"
pydantic = ">=2.5.0"
requests = ">=2.31.0"
python-dotenv = ">=1.0.0"
sqlalchemy = ">=2.0.0"
numpy = ">=1.26.0"
pytest = ">=7.0.0"
httpx = ">=0.24.0"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
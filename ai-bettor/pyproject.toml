[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bettor"
version = "0.2.0"
description = "AI Bettor - Autonomous AI sports betting analysis agent"
requires-python = ">=3.10"
# Floors here, exact pins in requirements.txt (what the image installs).
# psycopg2-binary is a hard dependency now: production runs on Neon.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.13",
    "requests>=2.31",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "httpx>=0.28"]

[project.scripts]
ai-bettor = "backend.main:main"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
